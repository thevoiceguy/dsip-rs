[package]
name = "dsip-media"
description = "DSIP native media endpoint (Phase 2): WebRTC DTLS-SRTP audio — offer/answer SDP, trickle ICE, Opus tone/file source, Ogg recording sink; backends: forge-media (default) and webrtc-rs (reference peer / fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
webrtc = { version = "0.13", optional = true }
webrtc-media = "0.10"
rtp = "0.13"
forge-webrtc = { git = "https://github.com/thevoiceguy/forge-media", rev = "b674552e4d22ad206c49eedca556c79bf77affe4", optional = true }
audiopus = "0.3.0-rc.0"
bytes = "1"

[features]
# Both backends are compiled by default: forge is what `Backend::default()` and the CLI pick;
# webrtc-rs stays in as the reference peer for the cross-backend test and as plan §7's fallback
# (`--media-backend webrtc-rs`). Build with `--no-default-features --features webrtc-rs` to leave
# forge (vendored OpenSSL) out.
default = ["forge", "webrtc-rs"]
# Backend: webrtc-rs (plan §7's named fallback).
webrtc-rs = ["dep:webrtc"]
# Backend: forge-media (the project's own stack; docs/forge-media-plan.md).
forge = ["dep:forge-webrtc"]

[dev-dependencies]
tracing-subscriber.workspace = true
# webrtc-rs's DTLS uses rustls; in a workspace build two crypto providers are compiled in
# (feature unification), so tests must pick one the way dsip-transport does.
rustls = { workspace = true, features = ["ring"] }
