[package]
name = "dsip-wasm"
description = "DSIP endpoint core for the browser: verifier, §12 engine, payload builder via wasm-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# dsip-mls (OpenMLS 0.9) sets the floor.
rust-version = "1.91"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dsip-core = { workspace = true, features = ["wasm"] }
dsip-schema.workspace = true
dsip-session.workspace = true
dsip-broadcast.workspace = true
dsip-endpoint = { workspace = true, features = ["wasm"] }
dsip-number.workspace = true
dsip-dht = { workspace = true, default-features = false }
dsip-messaging-device.workspace = true
dsip-mls.workspace = true
dsip-messaging.workspace = true
dsip-recording.workspace = true
# The browser's MLS: OpenMLS on dsip-messaging-device's MemoryStore (rust-crypto, memory storage the host saves);
# `js` gives it the browser's randomness and clock.
openmls = { version = "0.9.0", features = ["js"] }
openmls_traits = "0.6.0"
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
