[package]
name = "dsip-messaging-device"
description = "DSIP Messaging Profile 1.0, the device side on OpenMLS: one client for dsip-msg and the browser (dsip-rs stage 3)"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# openmls 0.9 requires 1.91, as dsip-mls.
rust-version = "1.91"

[dependencies]
dsip-core.workspace = true
dsip-endpoint.workspace = true
dsip-messaging.workspace = true
dsip-mls.workspace = true
dsip-recording.workspace = true
serde.workspace = true
serde_json.workspace = true
openmls = "0.9.0"
openmls_traits = "0.6.0"
openmls_rust_crypto = "0.6.0"
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
# `sqlite`: the native store, dsip-mls's SQLite provider (never on wasm32).
sqlite = ["dsip-mls/sqlite"]
# TypeScript declarations of the types the browser host sees (dsip-wasm).
ts = ["dep:tsify", "dep:wasm-bindgen"]

[[test]]
name = "store"
required-features = ["sqlite"]
