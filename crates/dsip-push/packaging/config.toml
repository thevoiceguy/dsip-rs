# dsip-push, as packaged. The unit is installed disabled: set did and app, put the push credentials where the
# service can read them, then `systemctl enable --now dsip-push`. A command-line flag of the same name overrides a
# key, and unknown keys are an error. The template with every key explained: /usr/share/doc/dsip-push/config.example.toml.

did = "did:web:push.example.com"                   # the gateway's DID: it serves the document at https://<host>/.well-known/did.json
app = ["fcm:example-project"]                      # provider:app, repeatable: apns:<bundle id>.voip, fcm:<Firebase project id>
listen = "0.0.0.0:8445"                            # a did:web without a port is fetched from 443: see below
state = "/var/lib/dsip-push"                       # its signing key seed, its handle key, and the certificate

# Push credentials: the service runs as a DynamicUser and cannot read root's files. Install each into its state
# directory, readable by the service alone:
#   /usr/libexec/dsip-push/install-credential AuthKey_XXXXXXXXXX.p8 apns-key.p8
#   /usr/libexec/dsip-push/install-credential service-account.json fcm.json
# apns_key = "/var/lib/dsip-push/credentials/apns-key.p8"
# apns_key_id = "XXXXXXXXXX"
# apns_team = "TEAMID1234"
# fcm_service_account = "/var/lib/dsip-push/credentials/fcm.json"
# Or deliver nothing and record each push, to try it out:
# record_to = "/var/lib/dsip-push/pushes.jsonl"

# TLS. Without cert and key the gateway makes a self-signed certificate in its state directory, for tests. For the
# DID's name, let certbot's deploy hook install the certificate where the service can read it, and reload it:
#   certbot certonly ... -d push.example.com --deploy-hook /usr/libexec/dsip-push/install-certificate
# then:
# cert = "/var/lib/dsip-push/tls/fullchain.pem"
# key = "/var/lib/dsip-push/tls/privkey.pem"
# Port 443 needs a drop-in (systemctl edit dsip-push): AmbientCapabilities=CAP_NET_BIND_SERVICE,
# CapabilityBoundingSet=CAP_NET_BIND_SERVICE and PrivateUsers=no, then listen = "0.0.0.0:443".
