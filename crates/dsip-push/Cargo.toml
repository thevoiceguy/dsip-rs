[package]
name = "dsip-push"
description = "DSIP push gateway (Wake Profile, draft): enrolments, wakes, and their delivery through APNs and FCM"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsip-push"
path = "src/main.rs"

[dependencies]
dsip-core.workspace = true
dsip-wake.workspace = true
dsip-transport = { workspace = true, features = ["cli"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
axum.workspace = true
aes-gcm.workspace = true
base64.workspace = true
rand.workspace = true
ring.workspace = true
reqwest = { workspace = true, features = ["http2"] }

# The .deb (packaging/build.sh): the static binary, the hardened DynamicUser unit, the config as a conffile. The unit is
# installed disabled: the gateway needs its DID, its apps and its push credentials first (packaging/config.toml).
[package.metadata.deb]
name = "dsip-push"
maintainer = "DSIP PoC <thevoiceguy@users.noreply.github.com>"
copyright = "the DSIP authors; MIT OR Apache-2.0"
section = "net"
priority = "optional"
extended-description = """\
A DSIP push gateway (Wake Profile, draft): an app's devices enrol their APNs or FCM token with it, and their relays \
and mailboxes ask it to wake them for a call or a message. It keeps no table of devices: each handle it issues is \
sealed under its own key."""
depends = "procps"   # /bin/kill, for the unit's ExecReload (SIGHUP)
conf-files = ["/etc/dsip-push/push.toml"]
maintainer-scripts = "packaging/debian/"
systemd-units = { unit-name = "dsip-push", enable = false, start = false, restart-after-upgrade = true }
assets = [
    ["target/release/dsip-push", "usr/bin/", "755"],
    ["packaging/config.toml", "etc/dsip-push/push.toml", "644"],
    ["../../packaging/install-certificate", "usr/libexec/dsip-push/install-certificate", "755"],
    ["packaging/install-credential", "usr/libexec/dsip-push/install-credential", "755"],
    ["config.example.toml", "usr/share/doc/dsip-push/config.example.toml", "644"],
    ["packaging/compose.yaml", "usr/share/doc/dsip-push/compose.yaml", "644"],
]

[dev-dependencies]
dsip-relay.workspace = true
dsip-endpoint.workspace = true
dsip-session.workspace = true
tokio-tungstenite.workspace = true
