[package]
name = "dsip-relay"
description = "DSIP relay as a library and a thin binary: hello binding, per-leg forking, attempt outcome signaling, store-and-forward, presence and broadcast authority"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsip-relay"
path = "src/main.rs"

[dependencies]
dsip-core.workspace = true
dsip-schema.workspace = true
dsip-session.workspace = true
dsip-transport = { workspace = true, features = ["cli"] }
dsip-broadcast.workspace = true
dsip-wake.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
redb.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
futures-util.workspace = true
tracing.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true

[dev-dependencies]
dsip-endpoint.workspace = true

# The .deb (packaging/build.sh): the static binary, the hardened DynamicUser unit, the config as a conffile.
[package.metadata.deb]
name = "dsip-relay"
maintainer = "DSIP PoC <thevoiceguy@users.noreply.github.com>"
copyright = "the DSIP authors; MIT OR Apache-2.0"
section = "net"
priority = "optional"
extended-description = """\
A DSIP relay: it binds devices by their verified hello, routes their signed envelopes, holds envelopes for offline \
recipients on disk, and is the presence and broadcast authority for the identities it serves. It can serve the \
browser client (dsip-web) on the same origin."""
depends = "procps"   # /bin/kill, for the unit's ExecReload (SIGHUP)
conf-files = ["/etc/dsip-relay/relay.toml"]
maintainer-scripts = "packaging/debian/"
systemd-units = { unit-name = "dsip-relay", enable = true, start = true, restart-after-upgrade = true }
assets = [
    ["target/release/dsip-relay", "usr/bin/", "755"],
    ["packaging/config.toml", "etc/dsip-relay/relay.toml", "644"],
    ["../../packaging/install-certificate", "usr/libexec/dsip-relay/install-certificate", "755"],
    ["config.example.toml", "usr/share/doc/dsip-relay/config.example.toml", "644"],
    ["packaging/compose.yaml", "usr/share/doc/dsip-relay/compose.yaml", "644"],
]
