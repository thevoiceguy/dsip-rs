[package]
name = "dsip-relay"
description = "DSIP relay as a library and a thin binary: hello binding, per-leg forking, attempt outcome signaling, store-and-forward, presence and broadcast authority"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsip-relay"
path = "src/main.rs"

[dependencies]
dsip-core.workspace = true
dsip-schema.workspace = true
dsip-session.workspace = true
dsip-transport = { workspace = true, features = ["cli"] }
dsip-broadcast.workspace = true
serde.workspace = true
serde_json.workspace = true
redb.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true

[dev-dependencies]
dsip-endpoint.workspace = true
