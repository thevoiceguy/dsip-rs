# One dsip-relay on 8443 (TLS: a self-signed certificate in its volume until you mount a real one). Its key seed,
# queue and certificate live in the `dsip-relay` volume.
services:
  dsip-relay:
    image: ghcr.io/thevoiceguy/dsip-relay:latest
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
    volumes:
      - dsip-relay:/var/lib/dsip-relay
      # a real certificate: a directory with fullchain.pem and privkey.pem readable by uid 65532 (certbot's own
      # files are root's), then `docker compose kill -s HUP dsip-relay` after each renewal
      # - /srv/dsip-relay/tls:/tls:ro
    # command: ["--cert", "/tls/fullchain.pem", "--key", "/tls/privkey.pem"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  dsip-relay:
