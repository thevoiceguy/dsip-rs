[package]
name = "dsip-endpoint"
description = "IO-free DSIP endpoint core: verify inbound frames, drive the §12 engine, build and sign outbound payloads. Shared by the native agent and the WASM build."
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dsip-core.workspace = true
dsip-schema.workspace = true
rand.workspace = true
dsip-session.workspace = true
dsip-recording.workspace = true
dsip-webrtc-binding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = []
wasm = ["dsip-core/wasm"]
# TypeScript declarations of the types the browser host sees (dsip-wasm).
ts = ["dsip-session/ts", "dep:tsify", "dep:wasm-bindgen"]
