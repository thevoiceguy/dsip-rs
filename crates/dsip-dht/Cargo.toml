[package]
name = "dsip-dht"
description = "DSIP DHT reachability hints (experimental, §8.5): signed hint records over libp2p Kademlia, verified, never authoritative"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dsip-dht-node"
path = "src/bin/dsip-dht-node.rs"
required-features = ["node"]

[features]
default = ["node"]
# The Kademlia node, its control port and the binary. Without it the crate is `record` alone (hint construction,
# verification and §8.3 selection), which builds for wasm32: the browser client publishes and selects hints through
# a node's HTTP API (DHT Hints Profile §10) with the same code the node runs.
node = ["dep:anyhow", "dep:thiserror", "dep:tokio", "dep:futures-util", "dep:tracing", "dep:tracing-subscriber", "dep:clap", "dep:libp2p"]

[dependencies]
dsip-core.workspace = true
dsip-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
sha2.workspace = true
libp2p = { workspace = true, optional = true }
