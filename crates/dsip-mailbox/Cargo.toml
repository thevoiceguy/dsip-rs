[package]
name = "dsip-mailbox"
description = "DSIP Messaging Profile 1.0 over the wire: the mailbox/hub service and a device client, driving the vector-pinned state machines with real MLS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Inherits dsip-mls's floor (OpenMLS 0.9).
rust-version = "1.91"

[dependencies]
dsip-core.workspace = true
dsip-messaging.workspace = true
dsip-events.workspace = true
dsip-recording.workspace = true
dsip-mls = { workspace = true, features = ["sqlite"] }
dsip-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
# SNMP over DTLS (RFC 6353 over UDP, E§3 v0.11): OpenSSL's DTLS server with the cookie exchange; rustls has no DTLS.
openssl.workspace = true
openssl-sys.workspace = true   # DTLS timeout handling: SSL_ctrl(DTLS_CTRL_HANDLE_TIMEOUT), which the openssl crate does not wrap
foreign-types.workspace = true
futures-util.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
x509-parser.workspace = true
base64.workspace = true
reqwest.workspace = true
rand.workspace = true
openmls = "0.9.0"

[[bin]]
name = "dsip-mailbox"
path = "src/bin/dsip-mailbox.rs"

[[bin]]
name = "dsip-msg"
path = "src/bin/dsip-msg.rs"
