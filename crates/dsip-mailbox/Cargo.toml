[package]
name = "dsip-mailbox"
description = "DSIP Messaging Profile 1.0 over the wire: the mailbox/hub service and a device client, driving the vector-pinned state machines with real MLS"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Inherits dsip-mls's floor (OpenMLS 0.9).
rust-version = "1.91"

[dependencies]
dsip-dht.workspace = true
dsip-core.workspace = true
dsip-messaging.workspace = true
dsip-events.workspace = true
dsip-recording.workspace = true
dsip-messaging-device = { workspace = true, features = ["sqlite"] }
dsip-messenger.workspace = true
dsip-mls = { workspace = true, features = ["sqlite"] }
dsip-transport = { workspace = true, features = ["cli"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
# SNMP over DTLS (RFC 6353 over UDP, E§3 v0.11): OpenSSL's DTLS server with the cookie exchange; rustls has no DTLS.
openssl.workspace = true
openssl-sys.workspace = true   # DTLS timeout handling: SSL_ctrl(DTLS_CTRL_HANDLE_TIMEOUT), which the openssl crate does not wrap
foreign-types.workspace = true
futures-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tracing.workspace = true
sha2.workspace = true
x509-parser.workspace = true
base64.workspace = true
reqwest.workspace = true
rand.workspace = true
rusqlite = "0.37"
openmls = "0.9.0"

[features]
# The packages' static (musl) binaries: SQLite and OpenSSL compiled in, not linked from the system
# (crates/dsip-mailbox/packaging/build.sh).
static = ["rusqlite/bundled", "openssl/vendored"]

[[bin]]
name = "dsip-mailbox"
path = "src/bin/dsip-mailbox.rs"

[[bin]]
name = "dsip-msg"
path = "src/bin/dsip-msg.rs"

# The .deb (packaging/build.sh): the static binary (feature `static`), the hardened DynamicUser unit, the config as
# a conffile.
[package.metadata.deb]
name = "dsip-mailbox"
maintainer = "DSIP PoC <thevoiceguy@users.noreply.github.com>"
copyright = "the DSIP authors; MIT OR Apache-2.0"
section = "net"
priority = "optional"
extended-description = """\
A DSIP mailbox and hub (Messaging Profile 1.0): it holds the items, KeyPackages and blobs of the identities it \
serves while their devices are offline, and orders and fans out the messages of the MLS groups it hosts."""
depends = "procps"   # /bin/kill, for the unit's ExecReload (SIGHUP)
conf-files = ["/etc/dsip-mailbox/mailbox.toml"]
maintainer-scripts = "packaging/debian/"
systemd-units = { unit-name = "dsip-mailbox", enable = true, start = true, restart-after-upgrade = true }
assets = [
    ["target/release/dsip-mailbox", "usr/bin/", "755"],
    ["packaging/config.toml", "etc/dsip-mailbox/mailbox.toml", "644"],
    ["../../packaging/install-certificate", "usr/libexec/dsip-mailbox/install-certificate", "755"],
    ["config.example.toml", "usr/share/doc/dsip-mailbox/config.example.toml", "644"],
    ["packaging/compose.yaml", "usr/share/doc/dsip-mailbox/compose.yaml", "644"],
]
