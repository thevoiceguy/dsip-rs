[package]
name = "dsip-mls"
description = "DSIP Messaging Profile 1.0 on real MLS (OpenMLS): DSIP device keys as MLS signers, dsip_delegation/dsip_conversation extensions, the DSIP authentication service on leaves, the hub's public view of a group, exporter-derived activity keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# openmls 0.9 requires 1.91; kept out of the rest of the workspace so its MSRV (1.85) is unchanged.
rust-version = "1.91"

[dependencies]
dsip-core.workspace = true
dsip-messaging.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }
sha2.workspace = true
hex.workspace = true
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
# `sqlite`: a device's MLS state and delivery state in one database, committed together (spec-gap 44).
openmls_sqlite_storage = { version = "0.3.0", optional = true }
rusqlite = { version = "0.37", optional = true }

[dev-dependencies]
# Cross-check of the profile's own HPKE (dsip-messaging::first_contact) against an independent implementation.
hpke-rs = { version = "0.7", features = ["rustcrypto"] }
hpke-rs-crypto = "0.7"
hpke-rs-rust-crypto = "0.7"
rand.workspace = true

[features]
sqlite = ["dep:openmls_sqlite_storage", "dep:rusqlite", "dep:serde"]

[[test]]
name = "persist"
required-features = ["sqlite"]
