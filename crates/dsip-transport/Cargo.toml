[package]
name = "dsip-transport"
description = "DSIP ws/1.0 signaling binding: wss connection, hello binding, size cap, reconnection; the Agent that drives dsip-session over it"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
dsip-core.workspace = true
# the hint records alone (no overlay node): the hints tier's client (`hints`)
dsip-dht = { workspace = true, default-features = false }
dsip-schema.workspace = true
dsip-session.workspace = true
dsip-endpoint.workspace = true
dsip-wake.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
rcgen.workspace = true
futures-util.workspace = true
tracing.workspace = true
reqwest.workspace = true
clap = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-journald = { workspace = true, optional = true }

[features]
# `config_file`: a service binary's TOML config file, read as its flags; `logging`: where its log lines go
cli = ["dep:clap", "dep:toml", "dep:tracing-subscriber", "dep:tracing-journald"]
