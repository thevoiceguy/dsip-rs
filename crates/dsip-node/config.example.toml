# dsip-node configuration (/etc/dsip-node/config.toml). Every key is optional and a command-line flag of the same
# name overrides it (e.g. --state-dir, --http, --overlay-listen, --mainline-port). Unknown keys are an error.
# A hints node is never authoritative (DSIP core §8.1): it verifies before storing or serving, clients verify again.

[node]
# Identity, learned peers, held records and Mainline routing nodes. Without it, nothing survives a restart.
state_dir = "/var/lib/dsip-node"

[overlay]
# The DSIP overlay (libp2p Kademlia, /dsip/hints/0.6). Leave `listen` empty to stay out of it.
listen = ["/ip4/0.0.0.0/tcp/4610"]
# Multiaddrs with /p2p/<PeerId>; /dns4/ names let an operator rotate nodes behind a name.
bootstrap = []

[mainline]
# The BitTorrent Mainline DHT, for Pkarr packets (DHT Hints Profile §9).
enabled = true
port = 6881
# Store and answer for others (needs a reachable UDP port), not only query.
server = true
# Empty: the public bootstrap nodes.
bootstrap = []

[http]
# The hints API (profile §10). Plain HTTP: put a TLS reverse proxy in front for public service.
listen = "0.0.0.0:8080"

[limits]
# Ban an overlay peer for this long once it spends its rejection budget (20 failed verifications in 60 s): its PUTs
# are dropped unverified for the whole ban and it leaves the routing table. Its connection stays open — closing it
# costs more, since a flooder redials and a PeerId is known only after the handshake. 0: only the budget's window.
ban_secs = 600
# Also refuse the banned peer's IP before the handshake, and close its connection: its redials then cost a TCP accept.
# PeerIds are free to mint, addresses are not — but honest peers behind the same NAT are refused too.
ban_ip = false
# HTTP requests per client IP per minute, answered 429 beyond (0: no limit).
http_requests_per_ip_per_min = 120
# Behind a reverse proxy that sets X-Forwarded-For, rate-limit by the client's address instead of the proxy's.
trust_x_forwarded_for = false

[numbers]
# Serve number bindings (Number Attestation Profile N§6, draft): GET/PUT /dsip/v1/tn/<E.164>. A binding is checked
# against this policy (JSON: trust_anchors = the STI-CA list as base64 DER, certificates = {x5u URL: PEM chain}, …)
# before it is stored. Unset: the routes answer 404.
# policy = "/etc/dsip-node/tn-policy.json"
