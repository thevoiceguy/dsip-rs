[package]
name = "dsip-gateway"
description = "DSIP SIP/PSTN gateway (Phase 4): §15.5 reason mapping both ways, SDP ⇄ descriptor mapping, PSTN caller claims, the §6.3 downgrade rule and the B2BUA controller (pure), plus the host that drives real legs (feature host): dsip-transport on the DSIP side, siphon-rs on the SIP side, forge-webrtc + forge-rtp media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dsip-core.workspace = true
dsip-webrtc-binding.workspace = true
serde.workspace = true
serde_json.workspace = true
# host
dsip-session = { workspace = true, optional = true }
dsip-endpoint = { workspace = true, optional = true }
dsip-transport = { workspace = true, optional = true }
forge-webrtc = { git = "https://github.com/thevoiceguy/forge-media", rev = "b674552e4d22ad206c49eedca556c79bf77affe4", optional = true }
forge-rtp = { git = "https://github.com/thevoiceguy/forge-media", rev = "b674552e4d22ad206c49eedca556c79bf77affe4", optional = true }
forge-codecs = { git = "https://github.com/thevoiceguy/forge-media", rev = "b674552e4d22ad206c49eedca556c79bf77affe4", optional = true }
sip-core = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "8350fd71123f8033e19adf7214d2d2704e9fbd5d", optional = true }
sip-parse = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "8350fd71123f8033e19adf7214d2d2704e9fbd5d", optional = true }
sip-uac = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "8350fd71123f8033e19adf7214d2d2704e9fbd5d", optional = true }
sip-uas = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "8350fd71123f8033e19adf7214d2d2704e9fbd5d", optional = true }
sip-dialog = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "8350fd71123f8033e19adf7214d2d2704e9fbd5d", optional = true }
audiopus = { version = "0.3.0-rc.0", optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
clap = { workspace = true, optional = true }

[features]
default = []
# The daemon half (opt-in; pulls siphon-rs + forge-media git deps, like dsip-media's forge feature): real DSIP, SIP and media legs around the pure controller.
host = ["dep:dsip-session", "dep:dsip-endpoint", "dep:dsip-transport", "dep:forge-webrtc", "dep:forge-rtp",
        "dep:forge-codecs", "dep:sip-core", "dep:sip-parse", "dep:sip-uac", "dep:sip-uas", "dep:sip-dialog", "dep:audiopus",
        "dep:tokio", "dep:anyhow", "dep:tracing", "dep:tracing-subscriber", "dep:bytes", "dep:clap"]

[[bin]]
name = "dsip-gateway"
path = "src/bin/dsip-gateway.rs"
required-features = ["host"]
