name: dsip-node release

# On a tag dsip-node-v<version> (matching crates/dsip-node's version): build and test every package as CI does, then
# attach the static binaries, tarballs, .debs and checksums to a GitHub release, and push the multi-arch image to
# ghcr.io/<owner>/dsip-node:<version> and :latest.
on:
  push:
    tags: ["dsip-node-v*"]

defaults:
  run:
    shell: bash

# The runner image's CMake 4 refuses projects declaring cmake_minimum_required < 3.5, which the Opus source vendored
# by audiopus_sys does; this lets it configure (ubuntu-latest moved to 26.04 on 2026-10-19).
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # spec/: DSIP at the pinned tag (schemas, vectors)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ziglang==0.13.0 pynacl cryptography
      - name: Rust, as pinned, plus the musl targets
        run: |
          rustup toolchain install && rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-zigbuild@0.23,cargo-deb@3" }
      - name: the tag names the crate's version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "${GITHUB_REF_NAME#dsip-node-v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME, crate version $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: bash crates/dsip-node/packaging/build.sh --image
      - run: bash crates/dsip-node/packaging/test.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: push the multi-arch image
        working-directory: crates/dsip-node
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dsip-node
          docker buildx build --platform linux/amd64,linux/arm64 -f packaging/Containerfile \
            -t "$image:$VERSION" -t "$image:latest" --push .
      - name: the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        working-directory: crates/dsip-node/dist
        run: |
          gh release create "$GITHUB_REF_NAME" --title "dsip-node $VERSION" \
            --notes "Static binaries (musl), .debs and the image ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dsip-node:$VERSION. Verify with SHA256SUMS. See docs/dsip-node-plan.md." \
            *.tar.gz *.deb SHA256SUMS
